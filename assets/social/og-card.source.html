<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #050505;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #050505;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: stretch;
  }
  /* faint scanline / grid texture for brand continuity, kept subtle so text stays legible */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,243,255,0.025) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, rgba(0,243,255,0.025) 0 1px, transparent 1px 44px);
    pointer-events: none;
  }
  .glow-corner {
    position: absolute;
    top: -180px; right: -180px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,243,255,0.16) 0%, rgba(0,243,255,0) 70%);
    pointer-events: none;
  }

  .left {
    position: relative;
    width: 640px;
    padding: 72px 0 0 76px;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    font-family: 'DejaVu Sans Mono', 'Liberation Mono', ui-monospace, monospace;
    font-size: 21px;
    letter-spacing: 4px;
    color: #00c3cc;
    text-transform: uppercase;
    margin-bottom: 26px;
  }
  .wordmark {
    font-family: 'DejaVu Sans Mono', 'Liberation Mono', ui-monospace, monospace;
    font-size: 132px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #ffffff;
    line-height: 1;
    text-shadow: 0 0 34px rgba(0,243,255,0.55), 0 0 90px rgba(0,243,255,0.18);
    margin-bottom: 30px;
  }
  .tagline {
    font-size: 30px;
    color: #e8e8e8;
    line-height: 1.35;
    max-width: 500px;
    margin-bottom: 40px;
  }
  .bullets {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .bullet {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'DejaVu Sans Mono', 'Liberation Mono', ui-monospace, monospace;
    font-size: 22px;
    color: #a8a8a8;
    letter-spacing: 0.5px;
  }
  .bullet .mark {
    color: #00f3ff;
    font-size: 22px;
  }

  .right {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .phone {
    position: relative;
    width: 300px;
    height: 502px;
    background: #0a0a0a;
    border: 3px solid #2a2a2a;
    border-radius: 34px;
    padding: 14px 10px;
    transform: rotate(4deg);
    box-shadow:
      0 0 0 1px rgba(0,243,255,0.25),
      0 30px 70px rgba(0,0,0,0.7),
      0 0 90px rgba(0,243,255,0.20);
  }
  .phone::before {
    /* speaker/notch line */
    content: "";
    position: absolute;
    top: 4px; left: 50%;
    transform: translateX(-50%);
    width: 60px; height: 5px;
    border-radius: 3px;
    background: #2a2a2a;
  }
  .phone .screen {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    overflow: hidden;
    background: #121212;
  }
  .phone .screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .cut {
    position: absolute;
    bottom: 40px;
    right: 56px;
    width: 300px;
    height: 40px;
    border: 1px solid #2a2a2a;
    border-left: none;
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DejaVu Sans Mono', 'Liberation Mono', ui-monospace, monospace;
    font-size: 15px;
    letter-spacing: 2px;
    color: #808080;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="glow-corner"></div>
    <div class="left">
      <div class="eyebrow">Non-traditional AAC</div>
      <div class="wordmark">ACK</div>
      <div class="tagline">A modern approach to AAC &mdash; gesture-driven, tap-first, built for situational mutism.</div>
      <div class="bullets">
        <div class="bullet"><span class="mark">&rsaquo;</span> Gesture + tap control</div>
        <div class="bullet"><span class="mark">&rsaquo;</span> Wear OS companion</div>
        <div class="bullet"><span class="mark">&rsaquo;</span> Composable statements &amp; decks</div>
      </div>
    </div>
    <div class="right">
      <div class="phone">
        <div class="screen">
          <img src="../screenshots/matrix-deck.png">
        </div>
      </div>
    </div>
    <div class="cut">aspdesignlabs.github.io/ACK</div>
  </div>
</body>
</html>
